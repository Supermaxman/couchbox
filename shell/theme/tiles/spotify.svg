<svg data-couchbox-glow="#1fd760" xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- couchbox home tile: Spotify (your music). Rendered to PNG by couchbox-home
       (rsvg-convert); data-couchbox-glow is the colour of the glow behind it. An original mark
       (sound bars on a record), not Spotify's logo. -->
  <defs>
    <clipPath id="r"><rect width="800" height="450" rx="36"/></clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.10"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.3" cy="0.3" r="1">
      <stop offset="0" stop-color="#16301f"/><stop offset="0.55" stop-color="#0f1a13"/><stop offset="1" stop-color="#09090b"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.85" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#1fd760" stop-opacity="0.30"/><stop offset="1" stop-color="#1fd760" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#r)">
    <rect width="800" height="450" fill="url(#bg)"/>
    <rect width="800" height="450" fill="url(#glow)"/>
    <g transform="translate(150 150)">
      <circle cx="75" cy="75" r="75" fill="#1fd760"/>
      <rect x="35" y="62" width="14" height="44" rx="7" fill="#0b0b0d"/>
      <rect x="60" y="40" width="14" height="66" rx="7" fill="#0b0b0d"/>
      <rect x="85" y="52" width="14" height="54" rx="7" fill="#0b0b0d"/>
      <rect x="110" y="70" width="14" height="36" rx="7" fill="#0b0b0d"/>
    </g>
    <text x="330" y="258" font-family="Inter, DejaVu Sans, sans-serif" font-size="92" font-weight="700" fill="#fafafa">Spotify</text>
    <rect width="800" height="450" fill="url(#sheen)"/>
  </g>
</svg>
