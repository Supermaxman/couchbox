<svg data-couchbox-glow="#8f7cf8" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="450" viewBox="0 0 800 450">
  <!-- couchbox home tile: Seerr (request movies and shows for Jellyfin). Rendered to PNG by
       couchbox-home (rsvg-convert); data-couchbox-glow is the colour of the glow behind it. -->
  <defs>
    <clipPath id="r"><rect width="800" height="450" rx="36"/></clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.10"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.3" cy="0.35" r="0.95">
      <stop offset="0" stop-color="#2a2f63"/><stop offset="0.55" stop-color="#171c38"/><stop offset="1" stop-color="#0e1222"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.82" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#c395fc" stop-opacity="0.35"/><stop offset="1" stop-color="#c395fc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#r)">
    <rect width="800" height="450" fill="url(#bg)"/>
    <rect width="800" height="450" fill="url(#glow)"/>
    <image x="170" y="160" width="460" height="137" xlink:href="logos/seerr.svg" preserveAspectRatio="xMidYMid meet"/>
    <rect width="800" height="450" fill="url(#sheen)"/>
  </g>
</svg>
