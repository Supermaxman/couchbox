<svg data-couchbox-glow="#14b8a6" xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- couchbox home tile: Search (Google search and pages, in a TV shell). Rendered to PNG by
       couchbox-home (rsvg-convert); data-couchbox-glow is the colour of the glow behind it. An
       original mark (a magnifier over lines of text), not Google's logo. -->
  <defs>
    <clipPath id="r"><rect width="800" height="450" rx="36"/></clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.10"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.3" cy="0.3" r="1">
      <stop offset="0" stop-color="#123236"/><stop offset="0.55" stop-color="#0d1a1d"/><stop offset="1" stop-color="#09090b"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.85" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.35"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#r)">
    <rect width="800" height="450" fill="url(#bg)"/>
    <rect width="800" height="450" fill="url(#glow)"/>
    <g transform="translate(140 150)">
      <rect x="0" y="0" width="150" height="150" rx="34" fill="#14b8a6"/>
      <circle cx="68" cy="66" r="34" fill="none" stroke="#fff" stroke-width="13"/>
      <rect x="50" y="54" width="36" height="8" rx="4" fill="#fff" opacity="0.6"/>
      <rect x="50" y="70" width="24" height="8" rx="4" fill="#fff" opacity="0.6"/>
      <path d="M93 91 L122 120" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
    </g>
    <text x="320" y="258" font-family="Inter, DejaVu Sans, sans-serif" font-size="92" font-weight="700" fill="#fafafa">Search</text>
    <rect width="800" height="450" fill="url(#sheen)"/>
  </g>
</svg>
