<svg data-couchbox-glow="#3b82f6" xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- couchbox home tile: Frigate (your cameras). Rendered to PNG by couchbox-home
       (rsvg-convert); data-couchbox-glow is the colour of the glow behind it. An original mark
       (a camera lens), not Frigate's logo. -->
  <defs>
    <clipPath id="r"><rect width="800" height="450" rx="36"/></clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.10"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.3" cy="0.3" r="1">
      <stop offset="0" stop-color="#1c2540"/><stop offset="0.55" stop-color="#111522"/><stop offset="1" stop-color="#09090b"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.85" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#r)">
    <rect width="800" height="450" fill="url(#bg)"/>
    <rect width="800" height="450" fill="url(#glow)"/>
    <g transform="translate(150 165)">
      <rect x="0" y="0" width="150" height="120" rx="30" fill="#3b82f6"/>
      <rect x="28" y="30" width="94" height="60" rx="14" fill="#fff"/>
      <circle cx="75" cy="60" r="20" fill="#3b82f6"/>
      <circle cx="75" cy="60" r="8" fill="#fff"/>
      <circle cx="128" cy="20" r="7" fill="#ef4444"/>
    </g>
    <text x="330" y="258" font-family="Inter, DejaVu Sans, sans-serif" font-size="92" font-weight="700" fill="#fafafa">Frigate</text>
    <rect width="800" height="450" fill="url(#sheen)"/>
  </g>
</svg>
