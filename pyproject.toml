[project]
name = "couchbox"
dynamic = ["version"]
description = "Open-source TV box for the Raspberry Pi 5"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["apps/*/qml", "media", "image/overlay"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S"]
ignore = ["S603", "S607", "S310", "S108", "S105", "S404", "S110", "S112", "B008", "UP038", "E501", "BLE001", "E731", "B007", "S311", "E741", "B023", "UP031"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S311"]

[tool.coverage.run]
source = ["src/couchbox"]
