name: Test an image

# Boot-test the image from an earlier run (nightly or release) with this branch's test script.
on:
  workflow_dispatch:
    inputs:
      run_id: {description: "Run that built the image", required: true}

permissions:
  contents: read
  actions: read

jobs:
  boot-test:
    runs-on: ${{ vars.ARM_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: get the image
        env: {GH_TOKEN: "${{ github.token }}", RUN: "${{ inputs.run_id }}"}
        run: gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n image -D out
      - name: boot the image in a container
        run: sudo image/test-image.sh out/couchbox-*-rpi5.img.xz
