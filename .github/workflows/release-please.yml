name: Release

# Merging to main keeps a "chore(main): release X.Y.Z" pull request up to date (version and
# CHANGELOG.md from the commit messages). Merging that PR tags vX.Y.Z, creates the GitHub
# release and builds, signs and attaches everything (build-release.yml).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
      prerelease: false
    secrets: inherit
