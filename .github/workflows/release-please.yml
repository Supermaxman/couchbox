name: Release

# Merging to main keeps a "chore(main): release X.Y.Z" pull request up to date (version and
# CHANGELOG.md from the commit messages). Merging that PR tags vX.Y.Z, creates the GitHub
# release and builds, signs and attaches everything (build-release.yml).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write
  attestations: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GitHub doesn't start workflows for a PR that the built-in token opened or updated, so
      # the release PR would have no checks; a manual (workflow_dispatch) run is allowed
      - name: run CI on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.rp.outputs.pr }}
        run: |
          branch=$(printf '%s' "$PR" | jq -r '.headBranchName // empty' 2>/dev/null || true)
          if [ -z "$branch" ]; then echo "no release PR this time"; exit 0; fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
      prerelease: false
    secrets: inherit
