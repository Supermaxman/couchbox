name: Nightly image

# The full image from main, booted in a container, every night (and on demand). Kept 7 days.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ${{ vars.ARM_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., file: ci/Dockerfile, tags: couchbox-dev, load: true, cache-from: "type=gha,scope=ci-image"}
      - name: build the .deb
        run: |
          docker run --rm -v "$PWD:/src" couchbox-dev sh -c '
            set -e; cp -r /src /tmp/b; cd /tmp/b; rm -rf .git build
            ci/set-version.sh "$(python3 -c "import re;print(re.search(r\"__version__ = .(.*?).$\", open(\"src/couchbox/__init__.py\").read(), re.M).group(1))")-nightly.$(date +%Y%m%d)"
            dpkg-buildpackage -us -uc -b && mkdir -p /src/dist && cp ../couchbox_*.deb /src/dist/'
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true; df -h /
      - name: build the image
        run: sudo image/build-image.sh "nightly-$(date +%Y%m%d)" dist out
      - name: boot test
        run: sudo image/test-image.sh out/couchbox-*-rpi5.img.xz
      - uses: actions/upload-artifact@v4
        with: {name: image, path: "out/*.img.xz*", retention-days: 7, compression-level: 0}
