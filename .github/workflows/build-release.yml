name: Build release

# Builds the packages and the image for a tag, signs release.json (the "release" environment
# holds the key and asks the maintainer to approve), attests every asset and uploads them.
on:
  workflow_call:
    inputs:
      tag: {required: true, type: string}
      prerelease: {required: true, type: boolean}
  workflow_dispatch:
    inputs:
      tag: {description: "Existing tag to (re)build, e.g. v0.1.0", required: true}
      prerelease: {description: "Prerelease", type: boolean, default: false}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  debs:
    runs-on: ${{ vars.ARM_RUNNER || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.tag }}"}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., file: ci/Dockerfile, tags: couchbox-dev, load: true, cache-from: "type=gha,scope=ci-image"}
      - name: build couchbox_*.deb
        env: {TAG: "${{ inputs.tag }}"}
        run: |
          docker run --rm -e TAG -v "$PWD:/src" couchbox-dev sh -c '
            set -e; cp -r /src /tmp/b; cd /tmp/b; rm -rf .git build
            ci/set-version.sh "$TAG"
            dpkg-buildpackage -us -uc -b
            lintian --fail-on error ../couchbox_*.deb
            mkdir -p /src/dist && cp ../couchbox_*.deb /src/dist/'
      - uses: actions/upload-artifact@v4
        with: {name: debs, path: dist/*.deb}

  media:
    runs-on: ubuntu-latest
    steps:
      - name: latest couchbox-media build (media.yml), if there is one
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p dist
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w media.yml -s success -L 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$run" ]; then gh run download "$run" -R "$GITHUB_REPOSITORY" -n couchbox-media -D dist || true; fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with: {name: media, path: dist/*, if-no-files-found: ignore}

  image:
    needs: [debs, media]
    runs-on: ${{ vars.ARM_RUNNER || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.tag }}"}
      - uses: actions/download-artifact@v8
        with: {pattern: "{debs,media}", path: dist, merge-multiple: true}
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true; df -h /
      - name: build the image
        env: {TAG: "${{ inputs.tag }}"}
        run: sudo image/build-image.sh "${TAG#v}" dist out
      - name: boot test (systemd-nspawn)
        run: sudo image/test-image.sh out/couchbox-*-rpi5.img.xz
      - uses: actions/upload-artifact@v4
        with: {name: image, path: "out/*", compression-level: 0}

  publish:
    needs: [debs, media, image]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.tag }}"}
      - uses: actions/download-artifact@v8
        with: {pattern: "{debs,media,image}", path: dist, merge-multiple: true}  # not the docker build records
      - name: installer and Raspberry Pi Imager list
        env: {TAG: "${{ inputs.tag }}"}
        run: |
          for f in install.sh convert-mtv.sh; do sed "s|__ALLOWED_SIGNERS__|$(cat system/keys/allowed_signers)|" "installer/$f" > "dist/$f"; done
          python3 image/imager-json.py "${TAG#v}" dist > dist/rpi-imager.json
          rm -f dist/*.extract.*
      - name: release notes
        env: {GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.tag }}"}
        run: gh release view "$TAG" --json body -q .body > notes.md || true
      - name: sign release.json
        env:
          TAG: ${{ inputs.tag }}
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          python3 ci/make-release.py "$TAG" dist --notes notes.md
          [ -n "$KEY" ] || { echo "::error::RELEASE_SIGNING_KEY isn't set (environment 'release')"; exit 1; }
          umask 077; printf '%s\n' "$KEY" > /tmp/key
          ssh-keygen -q -Y sign -f /tmp/key -n couchbox-release dist/release.json
          rm -f /tmp/key
          ssh-keygen -Y verify -f system/keys/allowed_signers -I release@couchbox -n couchbox-release -s dist/release.json.sig < dist/release.json
      - uses: actions/attest-build-provenance@v2
        with: {subject-path: "dist/*"}
      - name: upload
        env: {GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.tag }}", PRE: "${{ inputs.prerelease }}"}
        run: |
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --prerelease="$PRE" --latest="$([ "$PRE" = true ] && echo false || echo true)"
