# Couchbox: as the boot screen hands over to the TV session, remember how long this boot's
# steps took (the next boot's progress bar keeps that pace), and leave its last frame up until
# the session draws: the Plasma splash (org.couchbox.boot) carries on from it.
[Service]
ExecStartPre=-/usr/lib/couchbox/bin/couchbox-boot-status done
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
